version: "3.9"

services:
  web:
    build: .
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - PORT=5001
      - SECRET_KEY=${SECRET_KEY:-pharma-risk-dev-key}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/instance/pharma.db}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MFDS_API_KEY=${MFDS_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./instance:/app/instance   # SQLite DB 유지
      - ./ml:/app/ml               # 모델 파일 유지
      - ./data:/app/data           # FAERS 데이터 유지
      - ./rag_db:/app/rag_db       # RAG 벡터 DB 유지
    restart: unless-stopped
